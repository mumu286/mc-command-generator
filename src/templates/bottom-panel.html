<div class="bottom-panel">
    <div class="action-bar">
        <button class="btn-generate" id="generateBtn">⚡ 生成指令</button>
        <button class="btn-copy" id="copyBtn">📋 复制指令</button>
        <button class="btn-copy" id="historyBtn">🕘 历史</button>
        <span class="copy-feedback" id="copyFeedback">✅ 已复制到剪贴板</span>
        <span id="lengthWarning" style="color:#ff4444;font-size:13px;display:none;margin-left:8px;font-weight:600;">⚠️ 指令过长，请在命令方块中执行</span>
    </div>
    <div class="result-box" id="result">
        <span class="placeholder">点击「生成指令」后，最终指令会显示在这里</span>
    </div>
</div>
