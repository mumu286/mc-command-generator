<div id="tab-enchant" class="tab-pane active">
    <div class="enchant-controls">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px;">
            <!-- 预设附魔下拉框 -->
            <select id="enchantSelect" style="padding:6px 12px;border-radius:6px;border:1px solid #2a3a5a;background:#0f1a30;color:#e8e8e8;font-size:13px;min-width:140px;">
                <option value="minecraft:sharpness">锋利</option>
                <option value="minecraft:smite">亡灵杀手</option>
                <option value="minecraft:bane_of_arthropods">节肢杀手</option>
                <option value="minecraft:fire_aspect">火焰附加</option>
                <option value="minecraft:looting">抢夺</option>
                <option value="minecraft:sweeping_edge">横扫之刃</option>
                <option value="minecraft:knockback">击退</option>
                <option value="minecraft:power">力量</option>
                <option value="minecraft:punch">冲击</option>
                <option value="minecraft:flame">火矢</option>
                <option value="minecraft:infinity">无限</option>
                <option value="minecraft:efficiency">效率</option>
                <option value="minecraft:fortune">时运</option>
                <option value="minecraft:silk_touch">精准采集</option>
                <option value="minecraft:unbreaking">耐久</option>
                <option value="minecraft:mending">经验修补</option>
                <option value="minecraft:protection">保护</option>
                <option value="minecraft:fire_protection">火焰保护</option>
                <option value="minecraft:blast_protection">爆炸保护</option>
                <option value="minecraft:projectile_protection">弹射物保护</option>
                <option value="minecraft:feather_falling">摔落保护</option>
                <option value="minecraft:respiration">水下呼吸</option>
                <option value="minecraft:aqua_affinity">水下速掘</option>
                <option value="minecraft:depth_strider">深海探索者</option>
                <option value="minecraft:soul_speed">灵魂疾行</option>
                <option value="minecraft:swift_sneak">迅捷潜行</option>
                <option value="minecraft:thorns">荆棘</option>
                <option value="minecraft:loyalty">忠诚</option>
                <option value="minecraft:impaling">穿刺</option>
                <option value="minecraft:riptide">激流</option>
                <option value="minecraft:channeling">引雷</option>
                <option value="minecraft:multishot">多重射击</option>
                <option value="minecraft:quick_charge">快速装填</option>
                <option value="minecraft:piercing">穿透</option>
                <option value="minecraft:wind_burst">风爆</option>
            </select>
            <!-- 自定义附魔ID输入框（兼容模组） -->
            <input type="text" id="enchantCustom" placeholder="自定义ID..." style="padding:6px 10px;border-radius:6px;border:1px solid #2a3a5a;background:#0f1a30;color:#e8e8e8;font-size:13px;min-width:140px;">
            <input type="number" id="enchantLevel" value="1" min="1" max="255" style="width:60px;padding:6px 8px;border-radius:6px;border:1px solid #2a3a5a;background:#0f1a30;color:#e8e8e8;font-size:13px;">
            <span style="color:#556;font-size:13px;">等级</span>
            <button id="addEnchantBtn" style="padding:4px 14px;border-radius:6px;border:1px solid #2a6af4;background:transparent;color:#4a8af4;cursor:pointer;font-size:13px;">➕ 添加</button>
            <label style="color:#889;font-size:13px;margin-left:8px;">
                <input type="checkbox" id="glintCheck"> ✨ 光效
            </label>
        </div>
        <div id="enchantList" style="display:flex;flex-direction:column;gap:6px;min-height:30px;padding:4px 0;width:100%;">
            <!-- 附魔标签 -->
        </div>
        <div style="color:#556;font-size:12px;margin-top:4px;">💡 在“自定义ID”框中输入任意附魔ID（如 <code>mod:custom_enchant</code>）即可添加模组附魔</div>
    </div>
</div>
