<div class="right-panel">
    <!-- 标签栏 -->
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="enchant">✨ 附魔</button>
        <button class="tab-btn" data-tab="attribute">📊 属性</button>
        <button class="tab-btn" data-tab="block">🧱 方块</button>
        <button class="tab-btn" data-tab="base">📦 基础</button>
        <button class="tab-btn" data-tab="food">🍖 食物/工具</button>
    </div>
    <!-- 选项卡内容容器 -->
    <div class="tab-content" id="tabContentContainer">
        <!-- 各选项卡将由 JavaScript 动态加载 -->
    </div>

    <!-- 历史记录弹窗（位置/尺寸由 CSS 控制，默认隐藏） -->
    <div id="historyPanel" style="display:none;">
        <div class="history-header">
            <span>🕘 生成历史</span>
            <button class="history-close-btn" id="historyCloseBtn" type="button">✕</button>
        </div>
        <div class="history-list" id="historyList">
            <!-- 历史条目由 JS 渲染 -->
        </div>
    </div>
</div>
