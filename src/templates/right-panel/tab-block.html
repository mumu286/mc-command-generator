<div id="tab-block" class="tab-pane">
    <div class="enchant-controls">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px;">
            <div style="position:relative; flex:1; min-width:150px;">
                <input type="text" id="blockSearch" placeholder="搜索方块ID或名称..." style="width:100%;padding:6px 10px;border-radius:6px;border:1px solid #2a3a5a;background:#0f1a30;color:#e8e8e8;font-size:13px;outline:none;">
                <div id="blockSuggestions" class="suggestions-dropdown" style="display:none;"></div>
            </div>
            <select id="blockTypeSelect" style="padding:6px 12px;border-radius:6px;border:1px solid #2a3a5a;background:#0f1a30;color:#e8e8e8;font-size:13px;min-width:120px;">
                <option value="place">可放置于</option>
                <option value="break">可破坏</option>
                <option value="both">两者兼具</option>
            </select>
            <button id="addBlockBtn" style="padding:4px 14px;border-radius:6px;border:1px solid #2a6af4;background:transparent;color:#4a8af4;cursor:pointer;font-size:13px;">➕ 添加</button>
        </div>
        <div id="blockList" style="display:flex;flex-direction:column;gap:6px;min-height:30px;padding:4px 0;width:100%;">
            <!-- 方块标签 -->
        </div>
        <div style="color:#556;font-size:12px;margin-top:4px;">💡 用于冒险模式下工具可交互的方块</div>
    </div>
</div>
